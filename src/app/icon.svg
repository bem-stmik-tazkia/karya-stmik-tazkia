<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <style>
    :root {
      --k-color: #1E3A8A;
      --k-stroke: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --k-color: #FFFFFF;
        --k-stroke: transparent;
      }
    }
    .k-elem {
      fill: var(--k-color);
      stroke: var(--k-stroke);
      stroke-width: 2.5px;
      paint-order: stroke fill;
      stroke-linejoin: round;
    }
  </style>
  <g transform="translate(1.5, 16)">
    <!-- 1. Pil Vertikal Orange -->
    <rect x="10" y="10" width="28" height="108" rx="14" fill="#FF7F0A"/>
    <!-- 2. Huruf K (Navy di Light Mode, Putih Terang di Dark Mode) -->
    <rect class="k-elem" x="54" y="26" width="17" height="78"/>
    <polygon class="k-elem" points="67,63 105,26 126,26 80,72"/>
    <polygon class="k-elem" points="75,58 128,104 107,104 65,68"/>
    <!-- 3. Huruf T Orange Interlock -->
    <path d="M 90 26 L 99 26 L 83 42 L 77 42 C 77 32 82 26 90 26 Z" fill="#FF7F0A"/>
    <path d="M 131 26 L 147 26 C 147 35 141 42 132 42 L 122 42 L 122 92 C 122 99 116 104 106 104 L 106 56 L 131 26 Z" fill="#FF7F0A"/>
  </g>
</svg>
