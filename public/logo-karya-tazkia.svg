<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%" fill="none">
  <defs>
    <filter id="dropShadowLight" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="orangeGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8C1A"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>
  </defs>

  <!-- Simbol Ikon Monogram KT -->
  <g filter="url(#dropShadowLight)" transform="translate(15, 16)">
    <!-- 1. Pil Vertikal Orange -->
    <rect x="10" y="10" width="28" height="108" rx="14" fill="url(#orangeGradLight)"/>
    
    <!-- 2. Huruf K (Navy Blue) -->
    <rect x="54" y="26" width="17" height="78" fill="#131F33"/>
    <polygon points="67,63 105,26 126,26 80,72" fill="#131F33"/>
    <polygon points="75,58 128,104 107,104 65,68" fill="#131F33"/>

    <!-- 3. Huruf T Interlock (Orange) -->
    <path d="M 90 26 L 99 26 L 83 42 L 77 42 C 77 32 82 26 90 26 Z" fill="url(#orangeGradLight)"/>
    <path d="M 131 26 L 147 26 C 147 35 141 42 132 42 L 122 42 L 122 92 C 122 99 116 104 106 104 L 106 56 L 131 26 Z" fill="url(#orangeGradLight)"/>
  </g>

  <!-- Tipografi Teks -->
  <g transform="translate(195, 0)">
    <g filter="url(#dropShadowLight)">
      <text x="0" y="92" font-family="'Montserrat', 'Plus Jakarta Sans', sans-serif" font-size="60" font-weight="800" letter-spacing="-1">
        <tspan fill="#131F33">Karya</tspan>
        <tspan fill="#FF7F0A" dx="4">Tazkia</tspan>
      </text>
    </g>
    <text x="3" y="122" font-family="'Montserrat', 'Plus Jakarta Sans', sans-serif" font-size="18.5" font-weight="400" fill="#2D3748" letter-spacing="0.3">
      Kreativitas &amp; Inspirasi Tanpa Batas
    </text>
  </g>
</svg>

